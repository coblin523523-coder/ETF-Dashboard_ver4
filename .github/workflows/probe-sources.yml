name: 대체 출처 탐색 (1회용)

# 미래에셋 말고 '해외 IP(GitHub Actions 러너)에서도 열리는' ETF 구성종목 출처가
# 있는지 찾는다. 목표는 파싱이 아니라 딱 두 가지다.
#
#   1. 이 호스트가 해외 IP에서 응답을 하는가?      (미래에셋은 403)
#   2. 응답 안에 해외 편입 종목이 보이는가?        (KRX·KIS는 국내분만 줬다)
#
# 둘 다 통과하는 후보가 나오면, 그때 정확한 API 파라미터를 파고든다.
# 하나도 없으면 노트북 경유(PowerShell) 로 간다.
#
# 사용법: Actions → 이 워크플로 → Run workflow → 로그의 [결과 요약] 확인
# 저장소에 아무것도 커밋하지 않는다. 읽기만 한다.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 러너 위치 확인
        run: |
          echo "러너 공인 IP / 위치 (미래에셋이 막는 게 이 대역이다)"
          curl -s --max-time 10 https://ipinfo.io/json || echo "  (ipinfo 조회 실패 — 무시하고 진행)"

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: requests 설치
        run: pip install requests

      - name: 후보 출처 찔러보기
        run: |
          python - <<'PYEOF'
          import time, re, json
          import requests

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36")
          HDR = {"User-Agent": UA, "Accept-Language": "ko,en;q=0.8"}
          TICKER = "466950"
          ISIN = "KR7466950003"

          # 응답 안에 이게 보이면 '해외 편입 종목이 들어 있다'는 신호.
          # 466950 은 AMD·Kioxia·Microsoft 가 상위에 늘 있다.
          FOREIGN = ["Kioxia", "KIOXIA", "Advanced Micro", "AMD", "Microsoft",
                     "US0079031078", "Sandisk", "SANDISK", "Murata"]
          # 국내 종목만 나오는지 대조용 (KIS 가 이랬다)
          DOMESTIC = ["삼성전기", "삼성전자", "SK하이닉스"]

          CANDIDATES = [
              # ── 기준선: 지금 쓰는 곳. 해외 IP에서 403 이 나와야 정상 ──
              ("미래에셋 ajax (기준선)", "POST",
               "https://investments.miraeasset.com/tigeretf/ko/product/chart/prdct-item-list.ajax",
               {"ksdFund": ISIN, "prfPrd": "Week01", "fixDate": "20260831", "listCnt": "300"}),
              ("미래에셋 상세페이지 (기준선)", "GET",
               "https://investments.miraeasset.com/tigeretf/ko/product/prdct-detail.do",
               {"ksdFund": ISIN}),

              # ── 세이브로: 모바일 쪽이 데스크톱 WebSquare 보다 단순하다 ──
              ("세이브로 모바일 홈", "GET", "https://m.seibro.or.kr/", None),
              ("세이브로 모바일 ETF 발행현황", "GET",
               "https://m.seibro.or.kr/cnts/etf/selectPublishInfo.do", None),
              ("세이브로 데스크톱", "GET", "https://seibro.or.kr/", None),
              ("세이브로 오픈API 안내", "GET",
               "https://api.seibro.or.kr/pubc/pubr/cmm/CMPubrHome/viewCMPubrHome.do", None),

              # ── 민간 ETF 정보 사이트 ──
              ("ETF CHECK 홈", "GET", "https://www.etfcheck.co.kr/", None),
              ("ETF CHECK 종목", "GET",
               f"https://www.etfcheck.co.kr/mobile/etpitem/{TICKER}/basic", None),

              # ── 네이버 금융 ──
              ("네이버금융 ETF 페이지", "GET",
               f"https://finance.naver.com/item/main.naver", {"code": TICKER}),
              ("네이버금융 ETF 목록 API", "GET",
               "https://finance.naver.com/api/sise/etfItemList.nhn", None),

              # ── 기준선: 이미 실패로 결론난 곳 ──
              ("KRX 정보데이터시스템 (기준선)", "GET", "https://data.krx.co.kr/", None),
          ]

          results = []
          for name, method, url, params in CANDIDATES:
              row = {"name": name, "url": url}
              t0 = time.time()
              try:
                  if method == "POST":
                      r = requests.post(url, data=params, headers={
                          **HDR,
                          "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
                          "X-Requested-With": "XMLHttpRequest",
                      }, timeout=20)
                  else:
                      r = requests.get(url, params=params, headers=HDR, timeout=20)
                  body = r.text or ""
                  row.update({
                      "status": r.status_code,
                      "ms": int((time.time() - t0) * 1000),
                      "bytes": len(r.content),
                      "ctype": (r.headers.get("Content-Type") or "")[:40],
                      "foreign": sorted({m for m in FOREIGN if m in body}),
                      "domestic": sorted({m for m in DOMESTIC if m in body}),
                  })
              except Exception as exc:
                  row.update({"status": "ERR", "ms": int((time.time() - t0) * 1000),
                              "err": f"{type(exc).__name__}: {str(exc)[:80]}"})
              results.append(row)
              print(f"  {name:32s} → {row.get('status')} "
                    f"{row.get('bytes','-')}B {row.get('ms')}ms "
                    f"{'해외:' + ','.join(row['foreign']) if row.get('foreign') else ''}"
                    f"{row.get('err','')}")

          print("\n" + "=" * 70)
          print("[결과 요약]")
          print("=" * 70)

          reachable = [r for r in results if r.get("status") == 200]
          print(f"\n해외 IP에서 200 응답한 곳: {len(reachable)}/{len(results)}")
          for r in reachable:
              print(f"  · {r['name']}  ({r['bytes']}B, {r['ctype']})")

          withforeign = [r for r in reachable if r.get("foreign")]
          print(f"\n응답에 해외 종목명이 보인 곳: {len(withforeign)}")
          for r in withforeign:
              print(f"  · {r['name']}  →  {', '.join(r['foreign'])}")
          if not withforeign:
              print("  없음 — 홈페이지만 열린 것일 수 있다(구성종목 조회는 별도 API).")
              print("        200 이 뜬 호스트가 있으면 그 사이트의 실제 조회 API 를 다음에 판다.")

          blocked = [r for r in results if r.get("status") not in (200, None)
                     and r.get("status") != "ERR"]
          print(f"\n차단·오류로 막힌 곳: {len(blocked) + len([r for r in results if r.get('status')=='ERR'])}")
          for r in results:
              if r.get("status") == "ERR":
                  print(f"  · {r['name']}  →  {r['err']}")
              elif r.get("status") not in (200, None):
                  print(f"  · {r['name']}  →  HTTP {r['status']}")

          print("\n판단 기준")
          print("  · 미래에셋 두 줄이 403 이면 = 해외 IP 차단이 여전하다는 확인")
          print("  · 세이브로/ETF CHECK/네이버 중 200 이 뜨는 곳이 있으면 = 다음 후보")
          print("  · 전부 막히면 = 노트북 경유(PowerShell) 로 간다")
          PYEOF
