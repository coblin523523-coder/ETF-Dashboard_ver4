name: 대체 출처 탐색 (1회용)

# 미래에셋 차단이 '사이트 전체'인지 '일부 경로'인지 확정한다.
#
# 지금까지 알아낸 것:
#   · 403 본문이 "301 Moved Permanently → /magi/index.html" 이다.
#     보안 차단이 아니라 해외 접속자를 자산운용 메인으로 보내는 지역 분기.
#   · CloudFront 가 앞단에 있다 (X-Amz-Cf-Pop: DFW59-P7, 댈러스).
#   · securities.miraeasset.com 은 해외에서도 200.
#   · WebFetch(해외로 추정)로는 /tigeretf/ko/main/index.do 와
#     /magi/fund/list.do 가 200 으로 열렸다. 그런데 Actions 에서는 루트조차 403이었다.
#     → 둘 중 하나가 착시다. 여기서 확정한다.
#
# 저장소에 아무것도 커밋하지 않는다. 읽기만 한다.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 러너 위치
        run: curl -s --max-time 10 https://ipinfo.io/json || echo "(조회 실패)"

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: requests 설치
        run: pip install requests

      - name: 경로별 접근 가능 여부
        run: |
          python - <<'PYEOF'
          import requests

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36")
          ISIN = "KR7466950003"
          BASE = "https://investments.miraeasset.com"

          # 해외 종목이 실제로 실려 왔는지 보는 마커
          MARK = ["Kioxia", "KIOXIA", "Advanced Micro", "Microsoft",
                  "US0079031078", "Sandisk", "Murata", "rtnData"]

          PATHS = [
              # 이미 403 으로 확인된 것들 (기준선)
              ("루트",            "GET",  "/", None),
              ("구성종목 ajax",    "POST", "/tigeretf/ko/product/chart/prdct-item-list.ajax",
               {"ksdFund": ISIN, "prfPrd": "Week01", "fixDate": "20260903", "listCnt": "300"}),
              ("상세페이지",       "GET",  "/tigeretf/ko/product/prdct-detail.do", {"ksdFund": ISIN}),

              # WebFetch 로는 열렸던 것들 — 진짜 열리는지 확인
              ("TIGER 메인",       "GET",  "/tigeretf/ko/main/index.do", None),
              ("magi 메인",        "GET",  "/magi/index.do", None),
              ("magi 펀드목록",     "GET",  "/magi/fund/list.do", None),

              # 같은 사이트의 다른 경로들 — 어디까지 열리는지 경계 찾기
              ("TIGER 상품목록",    "GET",  "/tigeretf/ko/product/prdct-list.do", None),
              ("TIGER 정적 CSS",   "GET",  "/tigeretf/common_kr/pc/css/common.css", None),
              ("magi 펀드상세",     "GET",  "/magi/fund/view.do", {"fundCd": ISIN}),
          ]

          results = []
          for name, method, path, params in PATHS:
              url = BASE + path
              try:
                  hdr = {"User-Agent": UA, "Accept-Language": "ko,en;q=0.8"}
                  if method == "POST":
                      hdr["Content-Type"] = "application/x-www-form-urlencoded; charset=UTF-8"
                      hdr["X-Requested-With"] = "XMLHttpRequest"
                      r = requests.post(url, data=params, headers=hdr, timeout=20,
                                        allow_redirects=False)
                  else:
                      r = requests.get(url, params=params, headers=hdr, timeout=20,
                                       allow_redirects=False)
              except Exception as exc:
                  print(f"  {name:16s} 예외 {type(exc).__name__}: {str(exc)[:70]}")
                  results.append((name, "ERR", 0, []))
                  continue

              body = r.text or ""
              hits = sorted({m for m in MARK if m in body})
              loc = r.headers.get("Location", "")
              tag = ""
              if r.status_code == 403 and "/magi/" in loc:
                  tag = "  ← 해외 리다이렉트"
              print(f"  {name:16s} HTTP {r.status_code}  {len(r.content):>7}B"
                    f"{'  마커:' + ','.join(hits) if hits else ''}{tag}")
              results.append((name, r.status_code, len(r.content), hits))

          print("\n" + "=" * 66)
          print("[결과]")
          ok = [x for x in results if x[1] == 200]
          print(f"  해외 IP 에서 200: {len(ok)}/{len(results)}")
          for n, s, b, h in ok:
              print(f"    · {n}  ({b}B){'  마커:' + ','.join(h) if h else ''}")
          print(f"  403 으로 막힌 것: {[n for n,s,b,h in results if s == 403]}")

          print("\n[해석]")
          print("  · 전부 403 이면 → 사이트 전체 차단. WebFetch 는 한국 경유였던 것.")
          print("    이 경우 서울 리전 중계(AWS Lambda 등)로 가야 한다.")
          print("  · 일부만 200 이면 → 경로별 정책. 열린 경로 중 구성종목을 주는 게")
          print("    있는지 더 파보면 중계 없이 해결될 수 있다.")
          print("  · 200 인데 마커가 없으면 → 문은 열렸지만 데이터는 없는 껍데기 페이지.")
          PYEOF
