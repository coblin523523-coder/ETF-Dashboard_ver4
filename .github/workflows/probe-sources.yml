name: 대체 출처 탐색 (1회용)

# 미래에셋의 403 이 '나라 기준' 차단인지 '데이터센터 IP 기준' 차단인지 확인한다.
#
#   나라 기준이면  → 한국 클라우드(AWS 서울, 오라클 서울)로 해결된다
#   데이터센터 기준이면 → 한국 클라우드도 막힌다. 가정용 회선이 필요하다
#
# 판별 단서: 403 응답의 헤더(WAF 벤더, CDN)와 본문 문구.
# 저장소에 아무것도 커밋하지 않는다. 읽기만 한다.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 러너 위치
        run: curl -s --max-time 10 https://ipinfo.io/json || echo "(조회 실패)"

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: requests 설치
        run: pip install requests

      - name: 미래에셋 403 정체 확인
        run: |
          python - <<'PYEOF'
          import requests

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36")
          ISIN = "KR7466950003"

          TARGETS = [
              ("ajax (실제 쓰는 것)", "POST",
               "https://investments.miraeasset.com/tigeretf/ko/product/chart/prdct-item-list.ajax",
               {"ksdFund": ISIN, "prfPrd": "Week01", "fixDate": "20260903", "listCnt": "300"}),
              ("상세페이지", "GET",
               "https://investments.miraeasset.com/tigeretf/ko/product/prdct-detail.do",
               {"ksdFund": ISIN}),
              ("도메인 루트", "GET", "https://investments.miraeasset.com/", None),
              # 미래에셋의 다른 호스트도 같이 막히는지 (전사 정책인지 이 사이트만인지)
              ("securities 도메인", "GET", "https://securities.miraeasset.com/", None),
              ("m. 서브도메인", "GET", "https://m.investments.miraeasset.com/", None),
          ]

          for name, method, url, params in TARGETS:
              print("\n" + "=" * 66)
              print(f"[{name}]  {url}")
              try:
                  hdr = {"User-Agent": UA, "Accept-Language": "ko,en;q=0.8"}
                  if method == "POST":
                      hdr["Content-Type"] = "application/x-www-form-urlencoded; charset=UTF-8"
                      hdr["X-Requested-With"] = "XMLHttpRequest"
                      r = requests.post(url, data=params, headers=hdr, timeout=20,
                                        allow_redirects=False)
                  else:
                      r = requests.get(url, params=params, headers=hdr, timeout=20,
                                       allow_redirects=False)
              except Exception as exc:
                  print(f"  예외: {type(exc).__name__}: {str(exc)[:120]}")
                  continue

              print(f"  HTTP {r.status_code}   {len(r.content)}B")
              print("  ── 응답 헤더 ──")
              for k, v in r.headers.items():
                  print(f"     {k}: {v[:110]}")

              body = (r.text or "").strip()
              if body:
                  print("  ── 본문 앞부분 (500자) ──")
                  for line in body[:500].splitlines():
                      if line.strip():
                          print("     " + line.strip()[:110])

              # 차단 사유를 짐작할 만한 단서 찾기
              hints = []
              low = (body + " " + " ".join(f"{k}:{v}" for k, v in r.headers.items())).lower()
              for kw, meaning in [
                  ("cloudflare", "Cloudflare (나라 기준 규칙을 흔히 씀)"),
                  ("akamai", "Akamai"),
                  ("incapsula", "Imperva/Incapsula"),
                  ("wafer", "국내 WAF 계열"),
                  ("monitorapp", "MONITORAPP (국내 WAF)"),
                  ("piolink", "PIOLINK (국내 장비)"),
                  ("해외", "본문에 '해외' 언급 — 나라 기준 차단 가능성"),
                  ("국가", "본문에 '국가' 언급"),
                  ("access denied", "일반 접근 거부"),
                  ("forbidden", "일반 403"),
              ]:
                  if kw in low:
                      hints.append(meaning)
              print(f"  ── 단서: {hints if hints else '뚜렷한 단서 없음'}")

          print("\n" + "=" * 66)
          print("[해석 방법]")
          print("  · 본문에 '해외'·'국가' 문구가 있으면 → 나라 기준. 한국 클라우드로 해결됨")
          print("  · Cloudflare/Akamai 헤더가 보이면 → 보통 나라 기준 규칙. 한국 클라우드 유망")
          print("  · 국내 WAF 장비 이름이 보이면 → 자체 규칙. 한국 IP면 통과할 가능성 높음")
          print("  · 미래에셋 다른 호스트는 열리는데 investments 만 막히면 → 사이트별 정책")
          print("  어느 쪽이든 최종 판단은 '한국 클라우드에서 실제로 호출해보기' 로만 가능하다.")
          PYEOF
