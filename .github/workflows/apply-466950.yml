name: 466950 이력 교체 (1회용)

# 한국 IP에서 받은 466950 전체 이력(2023-11-01 ~ 2026-08-20, 684일)으로
# data/466950 을 통째로 교체하고 data/_legacy 의존을 제거한다.
#
# 사용법
#   1. 저장소 루트에 tiger_466950_history.zip 업로드
#   2. Actions 탭 → 이 워크플로 → Run workflow
#   3. 끝나면 이 파일과 실행 결과를 확인하고 이 워크플로를 삭제
#
# 검증에 실패하면 아무것도 커밋하지 않고 실행이 실패한다.
# 되돌리려면 git revert 하거나 커밋 하나를 되돌리면 된다.

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "이력 zip 경로 (저장소 기준)"
        required: false
        default: "tiger_466950_history.zip"
      dry_run:
        description: "검증만 하고 커밋하지 않기 (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: collect          # 일일 수집과 동시에 돌지 않도록
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 검증 및 교체
        env:
          ZIP_PATH: ${{ github.event.inputs.zip_path || 'tiger_466950_history.zip' }}
        run: |
          python - <<'PYEOF'
          import csv, os, shutil, sys, tempfile, zipfile
          from pathlib import Path

          REPO = Path.cwd()
          ZIP = REPO / os.environ["ZIP_PATH"]
          DATA = REPO / "data" / "466950"
          LEGACY = REPO / "data" / "_legacy" / "466950_tiger_daily.xlsx"

          HEADER = ["티커", "구성종목명", "계약수", "평가금액", "비중"]
          MIN_FILES, MIN_ROWS, TOL = 600, 20, 1.0
          KNOWN_BAD_SUM = {"20240712", "20260619", "20260706"}

          # 같은 종목인데 ISIN 이 바뀐 케이스. 최신 코드로 통일한다.
          # payload.py 가 '티커'로 편입/편출을 판정하므로 통일하지 않으면
          # 전환 시점에 같은 종목이 편출 → 신규 편입으로 두 번 잡힌다.
          ALIAS = {
              "US0567521085": "KYG070341048",  # Baidu (ADR → 케이맨 상장)
              "US0404131064": "US0404132054",  # Arista Networks (2024-12 액면분할)
              "CNE100000ML7": "CNE100000MLA",  # NAURA Technology
          }

          def die(msg):
              print(f"::error::{msg}")
              print("아무것도 변경하지 않았습니다.")
              sys.exit(1)

          if not ZIP.is_file():
              die(f"이력 zip 을 찾을 수 없습니다: {ZIP.relative_to(REPO)} "
                  f"— 저장소 루트에 업로드했는지 확인하세요")

          tmp = Path(tempfile.mkdtemp())
          with zipfile.ZipFile(ZIP) as z:
              z.extractall(tmp)
          src = tmp / "466950"
          if not src.is_dir():
              die("zip 안에 466950 폴더가 없습니다")

          files = sorted(src.glob("*.csv"))
          if len(files) < MIN_FILES:
              die(f"CSV 가 {len(files)}개뿐입니다 (최소 {MIN_FILES}개 기대)")

          # ── 1. ISIN 정규화 ──────────────────────────────────────
          changed = 0
          for f in files:
              with f.open(encoding="utf-8-sig", newline="") as fh:
                  rows = list(csv.DictReader(fh))
              hit = False
              for r in rows:
                  new = ALIAS.get(r["티커"])
                  if new:
                      r["티커"] = new
                      hit = True
              if hit:
                  changed += 1
                  with f.open("w", encoding="utf-8-sig", newline="") as fh:
                      w = csv.DictWriter(fh, fieldnames=HEADER)
                      w.writeheader(); w.writerows(rows)
          print(f"[정규화] ISIN 통일 {len(ALIAS)}종목 · {changed}개 파일 수정")
          for a, b in ALIAS.items():
              print(f"         {a} → {b}")

          # ── 2. 검증 ────────────────────────────────────────────
          print(f"\n[검증] 파일 {len(files)}개 · {files[0].stem} ~ {files[-1].stem}")
          problems, sums_off, counts = [], [], []
          prev_codes, max_turn = None, ("", 0.0)
          name_codes = {}

          for f in files:
              date = f.stem
              with f.open(encoding="utf-8-sig", newline="") as fh:
                  rd = csv.DictReader(fh)
                  hdr = rd.fieldnames or []
                  rows = list(rd)
              if hdr != HEADER:
                  problems.append(f"{date}: 헤더가 다릅니다 {hdr}"); continue
              if len(rows) < MIN_ROWS:
                  problems.append(f"{date}: 종목이 {len(rows)}개뿐입니다")
              counts.append(len(rows))
              try:
                  total = sum(float(r["비중"]) for r in rows)
              except ValueError:
                  problems.append(f"{date}: 비중에 숫자가 아닌 값이 있습니다"); continue
              if abs(total - 100.0) > TOL and date not in KNOWN_BAD_SUM:
                  sums_off.append((date, round(total, 2)))
              codes = {r["티커"] for r in rows}
              if not any(not c.startswith("KR") for c in codes):
                  problems.append(f"{date}: 해외 종목이 하나도 없습니다 (KIS 때와 같은 증상)")
              for r in rows:
                  name_codes.setdefault(r["구성종목명"], set()).add(r["티커"])
              if prev_codes:
                  turn = 1 - len(codes & prev_codes) / max(len(codes), 1)
                  if turn > max_turn[1]:
                      max_turn = (date, turn)
                  if turn > 0.4:
                      problems.append(f"{date}: 전일 대비 교체율 {turn:.0%} (이음매 의심)")
              prev_codes = codes

          for n, c in list({n: c for n, c in name_codes.items() if len(c) > 1}.items())[:5]:
              problems.append(f"종목명 '{n}' 에 티커가 여러 개: {sorted(c)}")

          counts.sort()
          print(f"       종목수 min {counts[0]} / 중앙 {counts[len(counts)//2]} / max {counts[-1]}")
          print(f"       최대 교체율 {max_turn[1]:.1%} ({max_turn[0]})")
          print(f"       비중합 이상(알려진 3건 제외): {sums_off if sums_off else '없음'}")
          print(f"       알려진 원본 이상은 그대로 통과: {sorted(KNOWN_BAD_SUM)}")

          if problems:
              print("\n[검증 실패]")
              for p in problems[:20]:
                  print("  -", p)
              if len(problems) > 20:
                  print(f"  ... 외 {len(problems)-20}건")
              die("검증을 통과하지 못했습니다.")
          print("       OK 검증 통과")

          # ── 3. 기존 데이터와 대조 ───────────────────────────────
          # 비중 0 이하 행(원화예금 정산 잔액)은 출처마다 남기고 버리는 기준이
          # 달라 비교에서 뺀다. TOP10 에 들어갈 수 없어 대시보드에 영향이 없다.
          def load(p):
              real, triv = {}, {}
              with p.open(encoding="utf-8-sig", newline="") as fh:
                  for r in csv.DictReader(fh):
                      try:
                          w = float(r["비중"])
                      except ValueError:
                          w = 0.0
                      if w > 0:
                          real[r["구성종목명"]] = (r["계약수"], r["평가금액"], r["비중"])
                      else:
                          triv[r["구성종목명"]] = r["비중"]
              return real, triv

          if DATA.is_dir():
              old = {p.name for p in DATA.glob("*.csv")}
              new = {p.name for p in src.glob("*.csv")}
              print(f"\n[대조] 기존 {len(old)}일 / 신규 {len(new)}일 / 겹침 {len(old & new)}일")
              missing = sorted(old - new)
              if missing:
                  die(f"기존에 있는데 신규에 없는 날짜 {len(missing)}건: {missing[:10]}")
              bad, triv_days = 0, []
              for name in sorted(old & new):
                  (a, ta), (b, tb) = load(DATA / name), load(src / name)
                  if set(a) != set(b) or any(a[k] != b[k] for k in a):
                      bad += 1
                      if bad <= 5:
                          print(f"       [!] {name} — 기존에만 {sorted(set(a)-set(b))} / "
                                f"신규에만 {sorted(set(b)-set(a))}")
                  if set(ta) != set(tb):
                      triv_days.append(name[:8])
              if bad:
                  die(f"겹치는 날짜 중 {bad}일의 비중 0 초과 종목이 기존과 다릅니다")
              print(f"       OK 겹치는 {len(old & new)}일 전부 일치 (비중 0 초과 종목 기준)")
              if triv_days:
                  print(f"       · 비중 0 이하 행만 다른 날 {len(triv_days)}건 "
                        f"— 원화예금 정산 잔액이라 무시합니다")
          else:
              print("\n[대조] 기존 data/466950 이 없어 건너뜁니다")

          # ── 4. 교체 ────────────────────────────────────────────
          if DATA.is_dir():
              shutil.rmtree(DATA)
          shutil.copytree(src, DATA)
          print(f"\n[교체] data/466950 에 {len(list(DATA.glob('*.csv')))}개 CSV 배치 완료")

          if LEGACY.is_file():
              LEGACY.unlink()
              print("[삭제] data/_legacy/466950_tiger_daily.xlsx "
                    "(엑셀 전용 날짜 0건 확인 · 456600용 timefolio_weekly.xlsx 는 유지)")

          ZIP.unlink()
          print(f"[삭제] {os.environ['ZIP_PATH']} (교체 완료 후 정리)")

          # ── 5. config.py 패치 ──────────────────────────────────
          import re
          cfg = REPO / "scripts" / "config.py"
          text = cfg.read_text(encoding="utf-8")

          OLD_CMT = ("        # 미래에셋은 해외 데이터센터 IP를 방화벽에서 막는다(홈페이지조차 403).\n"
                     "        # 그래서 GitHub 서버에서는 수집이 불가능하고, 이력은 data/_legacy 의\n"
                     "        # 엑셀에서 가져온다. 차단이 풀릴 수도 있으니 최신일 하루만 찔러본다.\n")
          NEW_CMT = ("        # 미래에셋은 '해외' IP만 막는다. GitHub Actions 러너는 403이지만\n"
                     "        # 한국 IP에서는 fixDate 파라미터로 과거 소급까지 정상 조회된다.\n"
                     "        # 전체 이력(2023-11-01~)은 한국 IP에서 받아 data/466950 에 직접 넣었다.\n"
                     "        # 일일 수집 경로를 한국 IP 로 옮기기 전까지 Actions 는 최신일만 찔러본다.\n")
          NEW_NOTE = '"note": "미래에셋이 해외 IP를 차단 중(한국 IP는 정상) · 이력은 한국 IP에서 수집",'

          done = []
          if OLD_CMT in text:
              text = text.replace(OLD_CMT, NEW_CMT); done.append("주석")
          if re.search(r'"note": "미래에셋이 서버 IP를 차단 중[^"]*",', text):
              text = re.sub(r'"note": "미래에셋이 서버 IP를 차단 중[^"]*",', NEW_NOTE, text)
              done.append("note")

          if done:
              cfg.write_text(text, encoding="utf-8")
              print(f"[config] 466950 {'·'.join(done)} 갱신 완료")
          elif NEW_NOTE in text:
              print("[config] 이미 갱신되어 있습니다")
          else:
              print("::warning::config.py 에서 예상한 문구를 찾지 못했습니다. "
                    "466950 의 note 를 수동으로 고쳐주세요.")
          PYEOF

      - name: 대시보드 생성
        run: python scripts/render.py

      - name: 변경분 커밋
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          ZIP_PATH: ${{ github.event.inputs.zip_path || 'tiger_466950_history.zip' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 명시한 경로만 담는다 (__pycache__ 등이 섞이지 않도록)
          git add -A data docs scripts/config.py
          git add -A -- "$ZIP_PATH" || echo "zip 이 추적 대상이 아니라 건너뜁니다"
          if git diff --staged --quiet; then
            echo "커밋할 변경 없음"
          else
            git diff --staged --stat | tail -5
            git commit -m "466950 전체 이력 교체 (2023-11 ~ 2026-08, 684일) · ISIN 통일 · _legacy 의존 제거"
            git push && echo "커밋·푸시 완료"
          fi

      - name: 검증만 한 경우 안내
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "dry_run 이라 커밋하지 않았습니다. 위 로그의 검증 결과만 확인하세요."
